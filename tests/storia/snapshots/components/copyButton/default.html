<button type="button" class="group/copy relative inline-flex shrink-0 items-center justify-center rounded-md text-faint transition-colors hover:bg-sunken hover:text-body focus:outline-none focus-visible:ring-2 focus-visible:ring-brand-line h-7 w-7" data-action="clipboard#copy" >
    <span data-clipboard-target="idle"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" height="1em" width="1em" class="h-4 w-4" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"></rect><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"></path></g></svg></span>
    <span class="text-emerald" data-clipboard-target="done" hidden><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" height="1em" width="1em" class="h-4 w-4" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 6L9 17l-5-5"></path></svg></span>
    <span role="tooltip" aria-live="polite" class="pointer-events-none absolute bottom-full left-1/2 z-10 mb-1.5 -translate-x-1/2 whitespace-nowrap rounded-md bg-inverse px-2 py-1 text-xs font-medium text-on-inverse opacity-0 transition-opacity group-hover/copy:opacity-100 group-focus-visible/copy:opacity-100">
        <span data-clipboard-target="idle">Copy command to clipboard</span>
        <span data-clipboard-target="done" hidden>Copied!</span>
    </span>
</button>
