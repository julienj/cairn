framework:
    rate_limiter:
        # What the API tokens of one user may send together (Security/ApiRateLimiter).
        api:
            policy: sliding_window
            limit: 300
            interval: '1 minute'
        # The password changes one account may try (Controller/AccountController):
        # whoever sits at an open session cannot guess the current password at will.
        password_change:
            policy: fixed_window
            limit: 5
            interval: '15 minutes'
        # The codes one account may try as a second factor (Security/TwoFactorThrottling).
        two_factor:
            policy: fixed_window
            limit: 5
            interval: '15 minutes'
